# .ai/config.yml — the brain of the workflow.
#
# The router and the drain read THIS file. Adding a classification, a
# priority, a status, or changing how something is routed is a one-file
# edit here. No code change, no CLAUDE.md edit — the contract in
# CLAUDE.md points at this file, so behavior changes when this changes.
#
# This is the single source of truth for the taxonomy.

# ---------------------------------------------------------------------------
# CLASSIFICATIONS
# When you interject, the input is classified into one of these and routed
# to `routes_to`. Add your own freely (spike, chore, security, idea, ...).
#
#   routes_to:    tickets | backlog | questions | notes | decisions | active-ticket
#   priority:     default priority assigned at capture (see `priorities`)
#   blocking:     never | always | when-touching-active | when-caused-by-active
#                 (when-touching-active  = block only if it concerns the file/area I'm in now)
#                 (when-caused-by-active = block only if it's a regression from my current change)
#   link:         optional — extra link the router should attach (e.g. causing-commit)
#   answerable_by: for questions — who can resolve it [claude, chris]
# ---------------------------------------------------------------------------
classifications:
  bug:          { routes_to: tickets,       priority: high,     blocking: when-touching-active }
  regression:   { routes_to: tickets,       priority: critical, blocking: when-caused-by-active, link: causing-commit }
  feature:      { routes_to: backlog,       priority: medium,   blocking: never }
  tech-debt:    { routes_to: backlog,       priority: low,      blocking: never }
  question:     { routes_to: questions,     blocking: never,    answerable_by: [claude, chris] }
  observation:  { routes_to: notes,         blocking: never }
  decision:     { routes_to: decisions,     blocking: never }
  request:      { routes_to: requests,      priority: medium,  blocking: never }
  epic:         { routes_to: epics,         priority: medium,  blocking: never }
  reminder:     { routes_to: reminders,     blocking: never }
  scope-change: { routes_to: active-ticket, blocking: always }

# ---------------------------------------------------------------------------
# PRIORITIES — highest first. Redefine to taste.
# ---------------------------------------------------------------------------
priorities: [critical, high, medium, low]

# ---------------------------------------------------------------------------
# STATUSES — the lifecycle a ticket moves through.
# Swap for your own vocabulary, e.g. [backlog, next, doing, blocked, shipped].
# `human_only` statuses are ones Claude must NOT set itself.
# ---------------------------------------------------------------------------
statuses:
  flow: [todo, doing, review, done]
  # EMPTY here: claude-kit runs `uat: none` (KIT-D034) — the maintainer delegated
  # acceptance ("you are more informed than I am on this particular project to do the
  # UAT"). The project TEMPLATE keeps human_only: [done].
  human_only: []
  # `superseded` is OFF-FLOW: a newer ticket retired this one (set `superseded_by:` here +
  # `supersedes:` on the replacement). It drops out of the active board + drain (KIT-T024).
  off_board: [superseded]

# ---------------------------------------------------------------------------
# UAT — who ACCEPTS finished work (KIT-D034). `review` is the UAT stage (KIT-D033).
#   default: required — finished work parks in `review`; only the human sets `done`.
#            none     — Claude closes work directly (review -> skipped) once every
#                       acceptance criterion passes WITH test evidence; the evidence
#                       floor (KIT-T061) applies at the closing transition either way.
#   Per-ticket override: frontmatter `uat: required|none` beats the project default.
# ---------------------------------------------------------------------------
uat:
  default: none   # this repo: acceptance delegated to the agent (KIT-D034)

# ---------------------------------------------------------------------------
# DRAIN — how the queue empties without Chris driving it.
# ---------------------------------------------------------------------------
drain:
  # When idle / between tickets, pull work in this type order (then by priority).
  order: [regression, bug, feature, tech-debt]
  # Respect ROADMAP.md milestone order when a current milestone exists;
  # fall back to `order` + priority when it doesn't.
  follow_roadmap: true
  # How bold Claude is when it picks up the next item unprompted:
  #   within-patterns-low-risk = do it if it follows established patterns and is low-risk;
  #                              otherwise surface a one-line "next up, your call".
  #   surface-only             = never start a new ticket without an explicit go.
  auto_execute: within-patterns-low-risk
  # Questions Claude can answer from code/decisions are answered + logged inline.
  # Questions needing Chris are surfaced BATCHED at natural breaks, not as interruptions.
  answer_self_questions: true
  # NOTE: drain.groomer knob removed (KIT-D030 — no config vapor: no implementation yet).

# ---------------------------------------------------------------------------
# DISPATCH — the CAPABILITY TABLE the orchestrator routes every delegation from (KIT-D080,
# KIT-T342; supersedes the KIT-D061 version-pinned ladder). Agent definitions carry NO model;
# the orchestrator picks per dispatch. A dispatch names a FAMILY only (fable | opus | sonnet |
# haiku) — the Agent tool's `model` param — which the harness resolves to that family's newest
# model; there is no exact-version request. `local-qwen` is the local lane (scripts/local-agent.mjs).
# THIS block is the ONLY table (KIT-D079): projects carry none, and orient flags a project
# `dispatch:` block as ignored drift. Resolve with `node <kit>/scripts/dispatch-ladder.mjs resolve
# [--type <ticket type>] [--job <job>]` and pass the family + effort as the Agent params.
#
# RESOLUTION ORDER (first hit wins), per ticket:
#   1. explicit `model:` / `effort:` on the ticket  → use verbatim (per-axis override)
#   2. explicit `tier:` on the ticket (names a job)  → that row
#   3. no field                                     → `default_job` for the ticket's type
#                                                      (then the catch-all `*`)
#
# FRESHNESS: every row carries an `evidence:` date and a `source:`. Inputs that move the table
# are the scheduled research refresh (KIT-T339) and our own dispatch outcomes
# (`node <kit>/scripts/dispatch-outcomes.mjs`). orient warns when the NEWEST evidence date is
# over 14 days old. Update a row's date only with new evidence, never to silence the warning.
# Effort values: low | medium | high | xhigh | max (inert on haiku). Effort is not portable
# across families: on a `fallback` re-derive it, never carry it.
# ---------------------------------------------------------------------------
dispatch:
  refresh_days: 14   # gate: dispatch blocks when the table's evidence / last model refresh is older (KIT-T339)
  jobs:
    chore:
      family: haiku
      effort: low
      cost: "cheapest; claude-haiku-4-5 retires 2026-10-15 (research/model-routing-ladder-2026-08.md)"
      evidence: 2026-08-06
      source: "KIT-D061 light rung; KIT-D022"
      use: "search, triage, mechanical edits"
    targeted-change:
      family: local-qwen
      fallback: sonnet
      effort: high
      cost: "free (local V100, 3 concurrent agents); escalate to sonnet after 2 failures on one ticket"
      evidence: 2026-10-05
      source: "KIT-D080; Chris 2026-10-05: 'Qwen is a decent coder if the change is straight forward and it's not having to be too creative or consider a large breadth of code. It's probably fine at making most targeted changes, given enough context.'"
      use: "a straightforward change in named files; the brief supplies files, line ranges and acceptance"
    fix:
      family: sonnet
      effort: high
      cost: "mid; cheaper than opus for the same straightforward work"
      evidence: 2026-09-30
      source: "KIT-D076; Chris 2026-09-30: 'Going forward sonnet 5.5 handles straightforward fixes.'"
      use: "straightforward fixes, gate wiring, diagnose-and-fix"
    refactor:
      family: sonnet
      effort: high
      cost: "mid"
      evidence: 2026-09-30
      source: "KIT-D076; KIT-T326"
      use: "multi-file behavior-preserving refactors and test authoring"
    research:
      family: sonnet
      effort: low
      cost: "mid; read-only"
      evidence: 2026-10-01
      source: "memory default-to-sonnet-for-contained-work (Chris 2026-10-01)"
      use: "read-only investigation across a codebase or the web"
    build:
      family: opus
      effort: high
      cost: "high"
      evidence: 2026-09-24
      source: "KIT-D073, KIT-D076 (opus and fable orchestrate; big pushes stay opus)"
      use: "big pushes: new crates, multi-file features, spatial or geometry work"
    design:
      family: opus
      effort: high
      cost: "high"
      evidence: 2026-09-30
      source: "KIT-D076"
      use: "architecture, planning, epics, root-cause analysis"
    ui:
      family: opus
      effort: high
      cost: "high"
      evidence: 2026-08-06
      source: "KIT-D061, KIT-D072"
      use: "UI and frontend creative work"
    asset:
      family: opus
      effort: medium
      cost: "high"
      evidence: 2026-10-05
      source: "Chris 2026-10-06: 'I doubt the game asset artist really fucking needs fable.'"
      use: "3D modeling and game-asset authoring; never fable"
    forensic:
      family: opus
      effort: high
      cost: "high; a failed first pass escalates to xhigh"
      evidence: 2026-08-06
      source: "KIT-D061 forensic row, fable dropped by KIT-D080"
      use: "regression first pass"
    deep:
      family: fable
      effort: high
      explicit_only: true
      cost: "highest; explicit request only"
      evidence: 2026-08-06
      source: "KIT-D061, KIT-D076"
      use: "frontier problems the orchestrator asks for by name"
  # Default job by ticket `type` when the ticket names no tier/model. Keys are classification
  # types (config.classifications); `*` is the catch-all.
  default_job:
    regression: forensic
    bug:        fix
    feature:    fix
    tech-debt:  chore
    request:    fix
    epic:       design
    "*":        fix
  # Family -> the newest model the harness resolves it to today. The ONLY place model ids live:
  # hooks derive the activity-line label from the id (hooks/model-tag.mjs), so a new release is
  # one line here. A model id anywhere in agents/, commands/ or skills/ fails the lint
  # (scripts/agent-pins.mjs).
  aliases:
    fable:  claude-fable-5
    opus:   claude-opus-5-5
    sonnet: claude-sonnet-5-5
    haiku:  claude-haiku-4-5

# ---------------------------------------------------------------------------
# PROVENANCE (KIT-D028 / KIT-T048) — an item must point UP to where it came from.
# `t status <id> doing` prints the item's trail and checks for an outbound
# antecedent link (links / parent / supersedes / regressed_from / introduced_by).
#   gate: warn   — say so and continue (default; a freshly-promoted capture
#                  arrives link-less by construction)
#         block  — refuse to start a trail-less ticket; the deliberate exception
#                  is `t status <id> doing --no-trail-check "<reason>"`
# Lint the whole store with `q orphans [scope]`.
# ---------------------------------------------------------------------------
provenance:
  gate: warn

# ---------------------------------------------------------------------------
# RECEIPTS — how routing is acknowledged so you can catch a misroute fast.
#   one-line = "→ BUG-024 logged, still on T-001"   | silent = no ack, check the board
# ---------------------------------------------------------------------------
receipts: one-line

# ---------------------------------------------------------------------------
# CAPTURE RATCHET — the Stop-time gate (hooks/request-gate.mjs) that makes request
# capture structural instead of memory-dependent. Requests have no choke point like
# `git commit`, so the gate manufactures one at the end of every assistant turn: if
# the last user message looks like an actionable request and nothing was captured
# this turn, it blocks the stop ONCE (loop-proof via stop_hook_active).
#   enabled: true|false   — turn the gate off per project.
#   mode:    block-once    — rigid: block the stop once (recommended).
#            warn          — soft: stderr only, never block.
#   release: a routing receipt ("→ KIT-T005 filed" / "… logged") OR a
#            "[no-capture: reason]" note in the reply OR any new/changed file in an
#            .ai capture store this turn satisfies the gate.
#   signals: case-insensitive regexes; these OVERRIDE the built-in default set.
# ---------------------------------------------------------------------------
capture:
  enabled: true
  mode: block-once
  signals:
    - "i'?d like"
    - "can you (add|make|build|create|write|set ?up)"
    - "could you (add|make|build|create)"
    - "we should"
    - "you should (add|make|build)"
    - "in the future"
    - "eventually"
    - "don'?t forget"
    - "it would be (nice|good|great)"
    - "let'?s\\b.*\\blater\\b"
    - "remember to"
    - "at some point"
    - "would be (nice|good|worth)"

# ---------------------------------------------------------------------------
# IDS — scheme is <KEY>-<TYPE><NUM>, so an id reads in a cross-project rundown.
#   key   = the project key (prefixes every id; HOD, KIT, ...)
#   type  = the store letter: ticket=T, decision=D, note=N, question=Q
#   num   = zero-padded counter
# e.g. KIT-T001 (ticket), KIT-D010 (decision). `prefix` is the ticket prefix.
# ---------------------------------------------------------------------------
ids:
  key: "KIT"
  prefix: "KIT-T"
  pad: 3            # KIT-T001, KIT-T002, ...

# ---------------------------------------------------------------------------
# NATIVE TASK SYNC (KIT-D005) — native task list is a live projection of tickets/.
# Slimmed to what the code reads (KIT-D030): sync-tasks.mjs reads `status_map`
# only; the behavioral contract (prefix, orphan promotion) is in CLAUDE.md.
# ---------------------------------------------------------------------------
native_task_sync:
  enabled: true
  status_map:
    todo: pending
    doing: in_progress
    review: completed
    done: completed

# ---------------------------------------------------------------------------
# ROADMAP — generated | narrative.  generated = thin sequence assembled from
# ticket frontmatter (milestone + priority) by scripts/index-tickets.mjs;
# narrative = a hand-curated prose ROADMAP the generator leaves alone.
# ---------------------------------------------------------------------------
roadmap_mode: generated

# ---------------------------------------------------------------------------
# WATCH_REPOS — extra repo paths (relative to the project root) the orient hook
# includes in its resume working-tree survey. Surfaces uncommitted + unpushed
# state in sibling repos so local-only work is never lost.
# ---------------------------------------------------------------------------
watch_repos: []

# ---------------------------------------------------------------------------
# HISTORY & REGRESSIONS (DECISIONS D-006). Every ticket carries an append-only
# ## History audit log; bugs link recurrences so regressions are tracked. Markdown
# only — INDEX.md / REGRESSIONS.md are GENERATED reference files, not the truth.
# ---------------------------------------------------------------------------
history:
  # event vocabulary for "- [YYYY-MM-DD HH:MM] (event) detail" lines in ## History
  events: [created, status, comment, decision, blocker, unblocked, fixed, regressed, asked again]
  # done tickets move here (relative to .ai/) so the active board stays small
  archive_done_to: tickets/archive
regressions:
  # frontmatter links on a recurrence ticket (type: regression)
  links: [regressed_from, causing_commit, fixed_commit]
  index_file: REGRESSIONS.md       # generated chains: original -> recurrences
  board_file: tickets/INDEX.md     # generated ticket board (id/type/status/title)

# Human tab title in the web UI (KIT-T137) — editable there; defaults to ids.key.
display_name: "Claude Kit"
